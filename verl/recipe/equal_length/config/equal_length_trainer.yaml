hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  max_prompt_length: 4096
  max_response_length: 4096
  train_batch_size: 32

actor_rollout_ref:
  model:
    # Keep hybrid convolution/recurrent states separate between trajectory rows.
    use_remove_padding: false
    override_config:
      attn_implementation: sdpa
      eqlen_router_fp32: true
  actor:
    policy_loss:
      loss_mode: eqlen_grpo
    loss_agg_mode: seq-mean-token-mean
    use_kl_loss: true
    kl_loss_coef: 0.002
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_epochs: 1
    ppo_micro_batch_size_per_gpu: 1
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
  ref:
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    name: vllm
    n: 1
    temperature: 1.0
    top_p: 1.0
    max_num_batched_tokens: 8192
    max_model_len: 8192
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      default_agent_loop: equal_length_agent
      agent_loop_manager_class: recipe.equal_length.rollout.EqualLengthAgentLoopManager
    engine_kwargs:
      vllm:
        hf_overrides:
          eqlen_router_fp32: ${actor_rollout_ref.model.override_config.eqlen_router_fp32}
    custom:
      equal_length:
        num_pairs: ${eqlen.num_pairs}
        seed: ${eqlen.seed}
    multi_turn:
      enable: false

algorithm:
  adv_estimator: eqlen
  use_kl_in_reward: false

critic:
  enable: false

reward:
  reward_model:
    enable: false

trainer:
  project_name: verl-eqlen
  experiment_name: eqlen-grpo
  balance_batch: true

# Recipe defaults are implementation choices, not recovered experiment settings.
eqlen:
  num_pairs: 8
  aggregation: max
  seed: 42
